<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área administrativa — FAC TECNOLOGIA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-box glass">
    <img src="assets/logo.png" alt="FAC TECNOLOGIA">
    <h2>Área administrativa</h2>
    <p>Entre com a senha para editar o conteúdo do site.</p>
    <div class="form-field">
      <label for="login-pass">Senha</label>
      <input id="login-pass" type="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;">Entrar</button>
    <p class="login-error" id="login-error"></p>
    <p style="margin-top:18px;"><a href="index.html" class="admin-link">← Voltar ao site</a></p>
  </div>
</div>

<!-- ===================== SHELL ===================== -->
<div id="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <img src="assets/logo.png" alt="FAC">
      <span>PAINEL&nbsp;ADMIN</span>
    </div>
    <nav class="admin-nav" id="admin-nav">
      <button data-tab="brand" class="active">Marca &amp; Contato</button>
      <button data-tab="hero">Seção Início</button>
      <button data-tab="about">Sobre</button>
      <button data-tab="services">Serviços</button>
      <button data-tab="ai">Inteligência Artificial</button>
      <button data-tab="portfolio">Portfólio</button>
      <button data-tab="clients">Clientes</button>
      <button data-tab="cases">Cases</button>
      <button data-tab="audiovisual">Audiovisual</button>
      <button data-tab="technologies">Tecnologias</button>
      <button data-tab="process">Processo</button>
      <button data-tab="differentials">Diferenciais</button>
      <button data-tab="testimonials">Depoimentos</button>
      <button data-tab="settings">Configurações</button>
    </nav>
    <div class="admin-sidebar-footer">
      <a href="index.html" target="_blank">Ver site publicado ↗</a>
      <button id="logout-btn">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Painel de edição</h1>
        <p>Tudo o que você mudar aqui aparece direto no site — sem precisar mexer em código.</p>
      </div>
      <div class="save-indicator" id="save-indicator"><span class="dot"></span><span>Salvo automaticamente</span></div>
    </div>

    <!-- MARCA & CONTATO -->
    <section class="admin-panel active" id="panel-brand"></section>
    <!-- HERO -->
    <section class="admin-panel" id="panel-hero"></section>
    <!-- ABOUT -->
    <section class="admin-panel" id="panel-about"></section>
    <!-- SERVICES -->
    <section class="admin-panel" id="panel-services"></section>
    <!-- AI -->
    <section class="admin-panel" id="panel-ai"></section>
    <!-- PORTFOLIO -->
    <section class="admin-panel" id="panel-portfolio"></section>
    <!-- CLIENTS -->
    <section class="admin-panel" id="panel-clients"></section>
    <!-- CASES -->
    <section class="admin-panel" id="panel-cases"></section>
    <!-- AUDIOVISUAL -->
    <section class="admin-panel" id="panel-audiovisual"></section>
    <!-- TECHNOLOGIES -->
    <section class="admin-panel" id="panel-technologies"></section>
    <!-- PROCESS -->
    <section class="admin-panel" id="panel-process"></section>
    <!-- DIFFERENTIALS -->
    <section class="admin-panel" id="panel-differentials"></section>
    <!-- TESTIMONIALS -->
    <section class="admin-panel" id="panel-testimonials"></section>
    <!-- SETTINGS -->
    <section class="admin-panel" id="panel-settings"></section>
  </main>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-text">Alterações salvas</span></div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
